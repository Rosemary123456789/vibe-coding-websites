<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-family: system-ui, -apple-system, sans-serif;
      color: #1a3a52;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }

    .background-slideshow {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    .background-slideshow img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      animation: fade 18s infinite;
    }

    .background-slideshow img:nth-child(1) { animation-delay: 0s; }
    .background-slideshow img:nth-child(2) { animation-delay: 6s; }
    .background-slideshow img:nth-child(3) { animation-delay: 12s; }

    @keyframes fade {
      0%, 100% { opacity: 0; }
      5%, 28% { opacity: 1; }
      33% { opacity: 0; }
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(173, 216, 230, 0.65);
      z-index: 1;
    }

    .content {
      position: relative;
      z-index: 2;
      max-width: 560px;
      background: rgba(255, 255, 255, 0.85);
      padding: 2.5rem 2rem;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(26, 58, 82, 0.15);
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      color: #0d4a6e;
    }

    p {
      font-size: 1.125rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="background-slideshow" aria-hidden="true">
    <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1920&q=80" alt="">
    <img src="https://images.unsplash.com/photo-1439068796017-947af634817a?w=1920&q=80" alt="">
    <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=1920&q=80" alt="">
  </div>
  <div class="overlay" aria-hidden="true"></div>

  <main class="content">
    <h1>Hello World</h1>
    <p>
      Hi, I'm Rose. I'm learning to build websites and enjoy exploring creative ways to code.
      This page is my first step into web development.
    </p>
  </main>
</body>
</html>
